# Uncomment the following lines to enable RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable OLED Display
# CONFIG_ZMK_DISPLAY=y

# Better wireless performance
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=8192
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# BLE throughput optimization (faster ZMK Studio over BLE)
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_PERIPHERAL_PREF_LATENCY=6

# Enable BLE experimental features
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Debounce and matrix settle configuration
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=6
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=10
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=10

# Hold one complete 5 x 15 matrix scan, including simultaneous releases.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=75

# Low Power States - Go to sleep after 300 mins (300*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=18000000
CONFIG_ZMK_IDLE_SKIP_ON_USB_POWER=y
CONFIG_ZMK_SLEEP=y

# Soft Off
CONFIG_ZMK_PM_SOFT_OFF=y

# USB Device Configuration
CONFIG_USB_DEVICE_PID=0xF002
CONFIG_USB_DEVICE_PRODUCT="Nenip Ph60MV2 HHKB"
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Mouse Keys
CONFIG_ZMK_POINTING=y

# Hardware watchdog: auto-reset if firmware hangs (potentially fix)
CONFIG_ZMK_UNRESPONSE_FIX=y
