manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware/
    - name: phdesign
      url-base: https://github.com/ph-design/
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: phdesign
      revision: v0.3-lts
      import: app/west.yml
    # Takes precedence over the moving v0.3_lts branch in zmk's app/west.yml,
    # whose newer messages need sources the pinned ZMK does not generate.
    - name: zmk-studio-messages
      remote: phdesign
      revision: 8201f24c9149e719e097dfcc92f2c33864c008be
      path: modules/msgs/zmk-studio-messages
  self:
    path: config

